name: Deliver Kujira screenshot report
'on':
  push:
    branches: ['qa/ui-docs-rerun-20261023']
    paths: ['.github/workflows/qa-deliver-ui-report.yml']
permissions:
  contents: write
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Kujira-current-main-UI-report
          run-id: 39930320166
          github-token: ${{ github.token }}
          path: report
      - name: Render actual evidence and publish illustrated QA report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Tests4gptplay/dsh-kujira-persona/git/ref/heads/main > report/main-readback.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/build_screenshot_report.py')
          s=p.read_text()
          s=s.replace("md.extend('| '+k+' | 取得预期结果 |' for k in checks)","md.extend(['| 检查项 | 结果 |','| --- | --- |']); md.extend('| '+k+' | 取得预期结果 |' for k in checks)")
          s=s.replace("'\\n\\n'.join(md)","'\\n'.join(md)")
          p.write_text(s)
          PY
          python3 qa/build_screenshot_report.py
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          text=Path('report/REPORT.md').read_text()
          Path('report-request.json').write_text(json.dumps({'branch':'qa/ui-docs-rerun-20261023','message':'test report: publish actual UI screenshots and transparent trial outcome','content':base64.b64encode(text.encode()).decode()}))
          Path('report/REPORT.md').write_text(text.replace('(screenshots/','('))
          PY
          gh api --method PUT repos/Tests4gptplay/dsh-kujira-persona/contents/qa/UI_TEST_REPORT.md --input report-request.json --silent
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('report'); p=root/'evidence-sha256.json'
          hashes={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in root.iterdir() if f.is_file() and f!=p}
          p.write_text(json.dumps(hashes,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Kujira-DSH-Illustrated-Test-Report
          path: report
          retention-days: 30
          if-no-files-found: error
