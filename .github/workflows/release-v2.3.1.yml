, "pet/assets/qwen-commanding-v1.png", "pet/assets/qwen-core-v1.png", "pet/assets/qwen-responding-v1.png", "pet/assets/qwen-searching-compare-return-v5-00.png", "pet/assets/qwen-searching-compare-return-v5-01.png", "pet/assets/qwen-searching-compare-return-v5-02.png", "pet/assets/qwen-searching-compare-return-v5-03.png", "pet/assets/qwen-searching-compare-return-v5-04.png", "pet/assets/qwen-searching-compare-return-v5-05.png", "pet/assets/qwen-searching-compare-return-v5-06.png", "pet/assets/qwen-searching-compare-return-v5-07.png", "pet/assets/qwen-searching-compare-return-v5-08.png", "pet/assets/qwen-searching-compare-return-v5-09.png", "pet/assets/qwen-searching-compare-return-v5-10.png", "pet/assets/qwen-searching-compare-return-v5-12.png", "pet/assets/qwen-searching-compare-return-v5-17.png", "pet/assets/qwen-searching-compare-return-v5-18.png", "pet/assets/qwen-searching-compare-return-v5-19.png", "pet/assets/qwen-status-v2.png", "pet/assets/qwen-testing-desk-v2.png", "pet/assets/qwen-thinking-v1.png", "pet/assets/stella-commanding-v1.png", "pet/assets/stella-core-v1.png", "pet/assets/stella-editing-v1.png", "pet/assets/stella-responding-v1.png", "pet/assets/stella-searching-v1.png", "pet/assets/stella-status-v2.png", "pet/assets/stella-testing-fixed-page-v1.png", "pet/assets/stella-thinking-v1.png", "pet/assets/stella-working-v1.png", "pet/client.js", "pet/controller.js", "pet/dsh-dafeiyu-LICENSE.txt", "pet/folders.js", "pet/index.js", "pet/model.js", "pet/native.js", "pet/native/win-x64/KujiraPet.exe", "pet/sprite-canvas.js", "pet/standard-manifest.js", "pet/stats.js", "pet/task.js", "pet/usage.js", "world/00-共同世界观.md", "world/10-公开角色名录.md", "world/12-星璃.md", "world/20-大家眼中的她们.md", "world/_资料来源.md"])
