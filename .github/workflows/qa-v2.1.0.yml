name: Kujira 2.1.0 candidate QA
on:
  push:
    branches:
      - release/v2.1.0-qa-20261026
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Syntax, AI diary, integration and existing DSH regressions
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.version!=="2.1.0" || !p.dsh?.bundle?.patch)process.exit(1)'
          find . -maxdepth 3 \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --test diary.test.js diary-integration.test.js
          SDK="$RUNNER_TEMP/kujira-session-sdk"
          npm install --prefix "$SDK" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org \
            @deepseek-ai/dsh-session@0.2.1-rc.2 @deepseek-ai/dsh-session-query@0.2.1-rc.2 \
            @deepseek-ai/dsh-session-projection@0.2.1-rc.2 @deepseek-ai/dsh-session-stats@0.2.1-rc.2 \
            @deepseek-ai/cordis@4.0.5
          DSH_TEST_ROOT="$SDK" node --test $(find scripts/qa -name '*check.mjs' ! -name 'playable-check.mjs' ! -name 'pet-menu-browser-check.mjs' | sort)
      - name: Pack and inspect actual distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kujira-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/kujira-package"
          test -f "$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.1.0.tgz"
          tar -tzf "$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.1.0.tgz" > "$RUNNER_TEMP/kujira-package/files.txt"
          for path in package/diary.js package/diary-integration.js package/index.js package/pet/client.js package/pet/native/win-x64/KujiraPet.exe package/README.md package/CHANGELOG.md; do
            grep -qx "$path" "$RUNNER_TEMP/kujira-package/files.txt"
          done
          if grep -E '/(scripts/qa|docs/development|\.github)/|package/(diary|diary-integration)\.test\.js$' "$RUNNER_TEMP/kujira-package/files.txt"; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.1.0.tgz" -C "$RUNNER_TEMP/unpacked"
          node -e 'const p=require(process.argv[1]);if(p.version!=="2.1.0")process.exit(1)' "$RUNNER_TEMP/unpacked/package/package.json"
          sha256sum "$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.1.0.tgz"
  browser-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install isolated React and DSH menu fixtures
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/kujira-browser"
          mkdir -p "$SDK"
          cp scripts/qa/pet-menu-browser-deps.json "$SDK/package.json"
          npm install --prefix "$SDK" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          "$SDK/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run real DOM menu, skin, drag and layout tests
        shell: bash
        run: |
          DSH_BROWSER_TEST_ROOT="$RUNNER_TEMP/kujira-browser" DSH_BROWSER_TEST_OUTPUT="$RUNNER_TEMP/kujira-browser-report" node scripts/qa/pet-menu-browser-check.mjs
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12
      - name: Build native desktop pet and verify WPF protocol and visibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/qa/verify-native.ps1 -OutputDirectory "$env:RUNNER_TEMP/kujira-native"
          if ($LASTEXITCODE -ne 0) { throw "Native QA failed: $LASTEXITCODE" }
