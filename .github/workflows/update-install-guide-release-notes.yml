name: Update published installation instructions
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/update-install-guide-release-notes.yml'
      - 'scripts/release-display-v2.4.2/NOTES.md'
permissions:
  contents: read
concurrency:
  group: dsh-kujira-persona-installation-notes-v2.4.2
  cancel-in-progress: false
jobs:
  update-notes:
    if: github.repository == 'Tests4gptplay/dsh-kujira-persona'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update only the existing release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/dsh-kujira-persona
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v2.4.2" > "$RUNNER_TEMP/release-before.json"
          jq -e '.tag_name == "v2.4.2" and .draft == false and .prerelease == false' "$RUNNER_TEMP/release-before.json"
          jq -r .body "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/body-before.md"
          test "$(sha256sum "$RUNNER_TEMP/body-before.md" | cut -d' ' -f1)" = 'ab061cfce2ebcefa208714982e7a4006a1db7f56c6d81d2e472c2ef43e5c09e6'
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/assets-before.json"
          gh api "repos/$GH_REPO/git/ref/tags/v2.4.2" > "$RUNNER_TEMP/tag-before.json"
          test "$(jq -r .object.sha "$RUNNER_TEMP/tag-before.json")" = '6fb63fe9b9d56a48e0abee214d4b96dcda14624b'
          test "$(sha256sum scripts/release-display-v2.4.2/NOTES.md | cut -d' ' -f1)" = 'dfdd3c9f38cf872d409d9b859490bc990c9a0241ac6e1fe49ff77da433f1699f'
          gh release edit v2.4.2 --notes-file scripts/release-display-v2.4.2/NOTES.md
          gh api "repos/$GH_REPO/releases/tags/v2.4.2" > "$RUNNER_TEMP/release-after.json"
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/assets-after.json"
          cmp "$RUNNER_TEMP/assets-before.json" "$RUNNER_TEMP/assets-after.json"
          gh api "repos/$GH_REPO/git/ref/tags/v2.4.2" > "$RUNNER_TEMP/tag-after.json"
          cmp "$RUNNER_TEMP/tag-before.json" "$RUNNER_TEMP/tag-after.json"
          jq -r .body "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/body-after.md"
          diff -u <(sed -e '${/^$/d;}' scripts/release-display-v2.4.2/NOTES.md) <(sed -e '${/^$/d;}' "$RUNNER_TEMP/body-after.md")
