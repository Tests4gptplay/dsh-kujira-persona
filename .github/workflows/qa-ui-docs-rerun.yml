name: Kujira UI docs rerun
run-name: Current-main DSH UI trial with screenshots
'on':
  push:
    branches: ['qa/ui-docs-rerun-20261023']
    paths: ['.github/workflows/qa-ui-docs-rerun.yml']
permissions:
  contents: write
  actions: read
jobs:
  trial:
    runs-on: ubuntu-22.04
    timeout-minutes: 42
    env:
      SOURCE_SHA: c5e633637689fe26254860dce862b41e4f1e068a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c5e633637689fe26254860dce862b41e4f1e068a
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: isolated-dsh-runtime
          run-id: 39917580157
          github-token: ${{ github.token }}
          path: runtime-download
      - name: Prepare exact current package and existing Chrome
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          gh api 'repos/Tests4gptplay/dsh-kujira-persona/contents/.github/workflows/qa-ui-docs-rerun.yml?ref=3e4693b61bdabd3906c9ef76743f9d2efac22503' --jq '.content' | base64 -d > qa/original-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('qa/original-workflow.yml').read_text()
          prep=textwrap.dedent(s.split('        run: |\n',1)[1].split('      - name: Real Web UI',1)[0])
          for line in ['qa/node_modules/.bin/playwright install chromium --with-deps','sudo apt-get update -qq','sudo apt-get install -y -qq fonts-noto-cjk']:
            prep=prep.replace(line,'')
          Path('qa/prepare.sh').write_text(prep)
          report=s.split('      - name: Build screenshot report from actual evidence',1)[1].split('        run: |\n',1)[1].split('      - uses: actions/upload-artifact',1)[0]
          Path('qa/build-report.sh').write_text(textwrap.dedent(report))
          PY
          bash qa/prepare.sh
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          test -n "$CHROME_PATH"
          "$CHROME_PATH" --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --max-time 90 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/live-relay.mjs');s=p.read_text()
          s=s.replace("chromium.launch({headless:true,args:['--no-sandbox']})", "chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']})")
          s=s.replace("async function publishImage(id) {", "function publishImage(id) {\n  const job=writes.then(async()=>{")
          s=s.replace("if(!r.ok)throw new Error('Screenshot publication '+r.status);\n}", "if(!r.ok)throw new Error('Screenshot publication '+r.status);\n  });\n  writes=job.catch(()=>{});\n  return job;\n}")
          p.write_text(s)
          PY
          node --check qa/live-relay.mjs
      - name: Real Web UI and current-assistant request relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: node qa/live-relay.mjs
      - name: Build screenshot report from actual evidence
        if: always()
        run: test ! -f qa/build-report.sh || bash qa/build-report.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kujira-current-main-UI-report
          path: trial/evidence
          retention-days: 14
          if-no-files-found: error
