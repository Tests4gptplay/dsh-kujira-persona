  windows-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b3674fec1600a7383a65ca92a3f46868182a8e8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install native file-lock dependency and run portable diary recovery tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-save --package-lock=false --no-audit --no-fund --registry https://registry.npmjs.org fs-native-extensions@1.5.1
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          node -e 'require("fs-native-extensions")'
          if ($LASTEXITCODE -ne 0) { throw 'Native file-lock dependency failed to load' }
          $checks = @(Get-ChildItem scripts/qa/release230/recovery, scripts/qa/release230/independent -Filter *.test.mjs | Sort-Object FullName | ForEach-Object { $_.FullName })
          node --test --test-concurrency=1 --test-timeout=60000 @checks
          if ($LASTEXITCODE -ne 0) { throw 'Portable diary regression failed' }
      - name: Build native desktop pet and verify WPF protocol and visibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/qa/verify-native.ps1 -OutputDirectory "$env:RUNNER_TEMP/kujira-native"
          if ($LASTEXITCODE -ne 0) { throw "Native QA failed: $LASTEXITCODE" }
      - name: Verify actual Windows packaged pet changes display surface without a stale window
        shell: pwsh
        env:
          KUJIRA_NATIVE_TEST_OUTPUT: ${{ runner.temp }}/kujira-native/surface-switch
        run: |
          node --test --test-timeout=60000 scripts/qa/surface-switch-native-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows surface-switch test failed' }
          $resultPath = Join-Path $env:KUJIRA_NATIVE_TEST_OUTPUT 'surface-switch-native-result.json'
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if ($result.passed -ne $true -or $result.liveChildren -ne 0) { throw 'Native surface evidence did not confirm success and zero live children' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kujira-231-native-checks
          path: ${{ runner.temp }}/kujira-native/

