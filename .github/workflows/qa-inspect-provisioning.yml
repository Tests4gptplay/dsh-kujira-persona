name: Inspect this trial preparation
'on':
  push:
    branches: ['qa/ui-docs-rerun-20261023']
    paths: ['.github/workflows/qa-inspect-provisioning.yml']
permissions:
  contents: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only this owned preparation if it has not entered the application
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Tests4gptplay/dsh-kujira-persona/actions/runs/39929175780/jobs > jobs.json
          if jq -e '.jobs[] | select(.id==120332896103) | .steps[] | select(.name=="Prepare isolated runtime and pack exact current source" and .status=="in_progress")' jobs.json; then
            gh api --method POST repos/Tests4gptplay/dsh-kujira-persona/actions/runs/39929175780/cancel
          else
            echo 'Application step already started or preparation finished; no cancellation.'
          fi
