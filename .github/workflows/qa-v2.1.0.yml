name: Kujira 2.1.0 verified release
on:
  push:
    branches:
      - release/v2.1.0-qa-20261026
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Syntax, AI diary, integration and existing DSH regressions
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.version!=="2.1.0" || !p.dsh?.bundle?.patch)process.exit(1)'
          find . -maxdepth 3 \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --test diary.test.js diary-integration.test.js
          SDK="$RUNNER_TEMP/kujira-session-sdk"
          npm install --prefix "$SDK" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org \
            @deepseek-ai/dsh-session@0.2.1-rc.2 @deepseek-ai/dsh-session-query@0.2.1-rc.2 \
            @deepseek-ai/dsh-session-projection@0.2.1-rc.2 @deepseek-ai/dsh-session-stats@0.2.1-rc.2 \
            @deepseek-ai/cordis@4.0.5
          DSH_TEST_ROOT="$SDK" node --test $(find scripts/qa -name '*check.mjs' ! -name 'playable-check.mjs' ! -name 'pet-menu-browser-check.mjs' | sort)
      - name: Pack and inspect actual distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kujira-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/kujira-package"
          test -f "$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.1.0.tgz"
          tar -tzf "$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.1.0.tgz" > "$RUNNER_TEMP/kujira-package/files.txt"
          for path in package/diary.js package/diary-integration.js package/index.js package/pet/client.js package/pet/native/win-x64/KujiraPet.exe package/README.md package/CHANGELOG.md; do
            grep -qx "$path" "$RUNNER_TEMP/kujira-package/files.txt"
          done
          if grep -E '/(scripts/qa|docs/development|\.github)/|package/(diary|diary-integration)\.test\.js$' "$RUNNER_TEMP/kujira-package/files.txt"; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.1.0.tgz" -C "$RUNNER_TEMP/unpacked"
          node -e 'const p=require(process.argv[1]);if(p.version!=="2.1.0")process.exit(1)' "$RUNNER_TEMP/unpacked/package/package.json"
          sha256sum "$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.1.0.tgz"
  browser-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install isolated React and DSH menu fixtures
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/kujira-browser"
          mkdir -p "$SDK"
          cp scripts/qa/pet-menu-browser-deps.json "$SDK/package.json"
          npm install --prefix "$SDK" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          "$SDK/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run real DOM menu, skin, drag and layout tests
        shell: bash
        run: |
          DSH_BROWSER_TEST_ROOT="$RUNNER_TEMP/kujira-browser" DSH_BROWSER_TEST_OUTPUT="$RUNNER_TEMP/kujira-browser-report" node scripts/qa/pet-menu-browser-check.mjs
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12
      - name: Build native desktop pet and verify WPF protocol and visibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/qa/verify-native.ps1 -OutputDirectory "$env:RUNNER_TEMP/kujira-native"
          if ($LASTEXITCODE -ne 0) { throw "Native QA failed: $LASTEXITCODE" }

  publish:
    needs: [regressions, browser-menu, windows-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Check exact main version, package bytes and install payload
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$CURRENT_MAIN" = 'bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12'
          node -e 'const p=require("./package.json");if(p.version!=="2.1.0"||!p.dsh?.bundle?.patch)process.exit(1)'
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          test -f dist/dsh-kujira-persona-2.1.0.tgz
          test "$(sha256sum dist/dsh-kujira-persona-2.1.0.tgz | cut -d ' ' -f1)" = 'd5aee4a7469adb3df5f2fce237321d49d8d2450cc45c94c196a50b02bb5cb682'
          tar -tzf dist/dsh-kujira-persona-2.1.0.tgz > dist/file-list.txt
          test "$(wc -l < dist/file-list.txt)" -eq 205
          test "$(grep -Ec '^package/pet/assets/.*\.png$' dist/file-list.txt)" -eq 120
          for item in package/diary.js package/diary-integration.js package/README.md package/CHANGELOG.md package/pet/native/win-x64/KujiraPet.exe; do
            grep -qx "$item" dist/file-list.txt
          done
          if grep -E '/(scripts/qa|docs/development|\.github)/|package/(diary|diary-integration)\.test\.js$' dist/file-list.txt; then exit 1; fi
          test "$(sha256sum pet/native/win-x64/KujiraPet.exe | cut -d ' ' -f1)" = '3276250225c201d64b96c32094b6cbe167a1bc5348597f0f668ca89dffd3c19d'
          (cd dist && sha256sum dsh-kujira-persona-2.1.0.tgz > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Assemble version-specific release notes
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^## 2[.]1[.]0/,/^## 2[.]0[.]4/{ /^## 2[.]0[.]4/!p; }' CHANGELOG.md > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md
          cat >> dist/RELEASE_NOTES.md <<'NOTES'

          ## 安装与升级

          DSH Desktop → 插件 → 添加插件：

          ```text
          github:Tests4gptplay/dsh-kujira-persona#v2.1.0
          ```

          Web：`dsh plugin --profile web add 'github:Tests4gptplay/dsh-kujira-persona#v2.1.0'`。

          保留原有的世界观、人设、记忆和桌宠配置。AI 日记为设置页中的可选实验功能，默认关闭，启用后可能增加 Token 消耗。
          
          本次 Windows 原生窗口、浏览器菜单和 AI 日记专项及回归测试通过。GitHub 发行附件包含对应 TGZ 与 SHA256 校验文件。
          NOTES
      - name: Publish immutable v2.1.0 tag and tested assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v2.1.0 already exists; preserving existing published assets'
            exit 0
          fi
          gh release create v2.1.0 dist/dsh-kujira-persona-2.1.0.tgz dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 'bd4fe8c21497c1c8838aa91d9fdf7d3ad3b57a12' \
            --title 'Kujira 2.1.0 — 可选 AI 日记' \
            --notes-file dist/RELEASE_NOTES.md \
            --latest
