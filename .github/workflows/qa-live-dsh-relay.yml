name: Prepare isolated DSH live relay
run-name: Prepare official DSH and released Kujira for isolated interactive testing
'on':
  push:
    branches: ['qa/live-dsh-relay-20261023']
    paths: ['.github/workflows/qa-live-dsh-relay.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Acquire official source, runtime and unmodified released plugin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payload/runtime payload/node-bin payload/evidence payload/releases
          git clone --depth=1 --branch dsh-v0.2.1-rc.2 https://github.com/deepseek-ai/deepseek-harness.git payload/dsh-source
          git -C payload/dsh-source rev-parse HEAD > payload/evidence/dsh-source-commit.txt
          git -C payload/dsh-source status --porcelain > payload/evidence/dsh-source-status.txt
          npm view @deepseek-ai/dsh@0.2.1-rc.2 version gitHead dist --json > payload/evidence/npm-origin.json
          npm install --prefix payload/runtime --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 pnpm@11.7.0
          cp "$(command -v node)" payload/node-bin/node
          gh release download v1.6.1 --repo Tests4gptplay/dsh-kujira-persona --pattern dsh-kujira-persona-1.6.1.tgz --dir payload/releases
          test "$(sha256sum payload/releases/dsh-kujira-persona-1.6.1.tgz | cut -d ' ' -f1)" = '01c03ee4ee10ec354086659838c216e14d6fc800985ae6c5b963a2c9e188a6fc'
          node --version > payload/evidence/node-version.txt
          payload/runtime/node_modules/.bin/dsh --help > payload/evidence/dsh-help.txt
          du -sh payload/*
          rm -rf payload/dsh-source/.git
          tar -czf dsh-isolated-runtime.tar.gz payload
          sha256sum dsh-isolated-runtime.tar.gz > dsh-isolated-runtime.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-dsh-runtime
          path: |
            dsh-isolated-runtime.tar.gz
            dsh-isolated-runtime.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
