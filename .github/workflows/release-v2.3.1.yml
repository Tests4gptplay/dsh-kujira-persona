name: Kujira 2.3.1 verified release
on:
  push:
    branches:
      - release/v2.3.1-ci-20261028
permissions:
  contents: read
jobs:
  regressions:
    outputs:
      package-sha256: ${{ steps.package.outputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b3674fec1600a7383a65ca92a3f46868182a8e8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Syntax, AI diary, integration and existing DSH regressions
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.version!=="2.3.1" || !p.dsh?.bundle?.patch)process.exit(1)'
          find . -maxdepth 3 \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          SDK="$RUNNER_TEMP/kujira-session-sdk"
          npm install --prefix "$SDK" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org \
            @deepseek-ai/dsh-session@0.2.1-rc.2 @deepseek-ai/dsh-session-query@0.2.1-rc.2 \
            @deepseek-ai/dsh-session-projection@0.2.1-rc.2 @deepseek-ai/dsh-session-stats@0.2.1-rc.2 \
            @deepseek-ai/dsh-system-prompt@0.2.1-rc.2 @deepseek-ai/dsh-tools@0.2.1-rc.2 \
            @deepseek-ai/dsh-agent@0.2.1-rc.2 @deepseek-ai/dsh-llm@0.2.1-rc.2 @deepseek-ai/dsh-scope@0.2.1-rc.2 \
            @deepseek-ai/cordis@4.0.5
          npm install --no-save --package-lock=false --no-audit --no-fund --registry https://registry.npmjs.org fs-native-extensions@1.5.1
          node -e 'require("fs-native-extensions")'
          export DSH_TEST_ROOT="$SDK"
          export NODE_PATH="$SDK/node_modules"
          mapfile -t checks < <(find scripts/qa -maxdepth 1 -name '*-check.mjs' ! -name '*browser*' ! -name 'playable-check.mjs' | sort)
          node --test --test-concurrency=1 --test-timeout=60000 *.test.js scripts/qa/*.test.mjs scripts/qa/diary-audit/*.test.mjs "${checks[@]}" scripts/qa/release230/*.test.mjs scripts/qa/release230/recovery/*.test.mjs scripts/qa/release230/independent/*.test.mjs
      - name: Pack and verify every distribution file against exact source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(git rev-parse HEAD)" = '7b3674fec1600a7383a65ca92a3f46868182a8e8'
          git diff --exit-code d930b2adcc2aec932ad7d85576488f8fe75045c4 7b3674fec1600a7383a65ca92a3f46868182a8e8 -- pet/assets 'pet/art*.js'
          test "$(sha256sum pet/native/win-x64/KujiraPet.exe | cut -d ' ' -f1)" = 'c2c8124e133450018374bc1e00a7e6519bda49eef711b010acf72c632f151663'
          mkdir -p "$RUNNER_TEMP/kujira-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/kujira-package"
          PACKAGE="$RUNNER_TEMP/kujira-package/dsh-kujira-persona-2.3.1.tgz"
          python - "$PACKAGE" <<'PYVERIFY'
          import hashlib,json,pathlib,subprocess,sys,tarfile
          expected=set(["CHANGELOG.md", "LICENSE", "NOTICE.md", "README.md", "catalog.js", "cordis.patch.yml", "daily-diary.js", "diary-integration.js", "diary-sleep.js", "diary.js", "dossier.js", "icon.svg", "index.js", "instructions/README.md", "locale/en.json", "locale/zh.json", "package.json", "persona-migration.js", "persona/00-身份.md", "persona/10-外观.md", "persona/20-性格.md", "persona/30-说话.md", "persona/40-世界观分层.md", "persona/50-关系.md", "persona/60-我们的原创设定.md", "persona/70-记忆协议.md", "persona/80-资料源.md", "persona/90-记忆.md", "persona/_编辑说明.md", "personas/claude/00-基础设定.md", "personas/claude/90-记忆.md", "personas/doubao/00-基础设定.md", "personas/doubao/90-记忆.md", "personas/gemini/00-基础设定.md", "personas/gemini/90-记忆.md", "personas/glm/00-基础设定.md", "personas/glm/90-记忆.md", "personas/gpt/00-身份.md", "personas/gpt/10-外观.md", "personas/gpt/20-性格与表达.md", "personas/gpt/70-学习规则.md", "personas/gpt/90-记忆.md", "personas/gpt/_来源说明.md", "personas/grok/00-基础设定.md", "personas/grok/90-记忆.md", "personas/hunyuan/00-基础设定.md", "personas/hunyuan/90-记忆.md", "personas/kimi/00-基础设定.md", "personas/kimi/90-记忆.md", "personas/llama/00-基础设定.md", "personas/llama/90-记忆.md", "personas/mimo/00-基础设定.md", "personas/mimo/90-记忆.md", "personas/minimax/00-基础设定.md", "personas/minimax/90-记忆.md", "personas/mistral/00-基础设定.md", "personas/mistral/90-记忆.md", "personas/qwen/00-基础设定.md", "personas/qwen/90-记忆.md", "personas/stella/00-基础设定.md", "personas/stella/90-记忆.md", "personas/stella/_来源说明.md", "pet/NOTICE.md", "pet/activity.js", "pet/animation.js", "pet/art-secondary.js", "pet/art-state-completion.js", "pet/art.js", "pet/assets/claude-commanding-v001.png", "pet/assets/claude-core-work-v2.png", "pet/assets/claude-responding-v001.png", "pet/assets/claude-searching-v001.png", "pet/assets/claude-status-v2.png", "pet/assets/claude-testing-v001.png", "pet/assets/claude-thinking-v001.png", "pet/assets/deepseek-commanding-v001.png", "pet/assets/deepseek-drag-land-v1.png", "pet/assets/deepseek-idle-think-v2.png", "pet/a