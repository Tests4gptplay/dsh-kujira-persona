name: Archive paused Kujira v2 checkpoint
run-name: Save existing desktop-pet artifacts without rerunning tests
'on':
  push:
    branches: [qa/single-model-pet-20261023]
    paths: [.github/workflows/pet-checkpoint.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa-repo
      - uses: actions/checkout@v4
        with:
          ref: feat/v2.0.0-single-model-pet
          path: feature
      - uses: actions/download-artifact@v4
        with:
          name: pet-candidate-source
          run-id: 39959578014
          github-token: ${{ github.token }}
          path: downloads/source
      - uses: actions/download-artifact@v4
        with:
          name: pet-unit-evidence
          run-id: 39959578014
          github-token: ${{ github.token }}
          path: downloads/unit
      - uses: actions/download-artifact@v4
        with:
          name: pet-windows-evidence
          run-id: 39959578014
          github-token: ${{ github.token }}
          path: downloads/windows
      - uses: actions/download-artifact@v4
        with:
          name: pet-web-evidence
          run-id: 39959578014
          github-token: ${{ github.token }}
          path: downloads/web-latest
      - uses: actions/download-artifact@v4
        with:
          name: pet-web-evidence
          run-id: 39958642948
          github-token: ${{ github.token }}
          path: downloads/web-passed
      - name: Save only existing artifacts and paused task notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C feature rev-parse HEAD)" = '463fb2e84847555f0c88d44d57106b93db6dd839'
          test "$(git -C feature ls-remote origin refs/heads/main | cut -f1)" = '6a9649612dc99ed8030aa5e961af42a37902598f'
          mkdir restored
          tar -xzf downloads/source/candidate-source.tgz -C restored
          python3 qa-repo/qa/scripts/checkpoint-v2.py
          test ! -d feature/.github
          test ! -d feature/qa
          git -C feature config user.name 'github-actions[bot]'
          git -C feature config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C feature add -A
          git -C feature commit -m 'checkpoint: preserve v2.0.0 single-pet work in progress, source and artwork'
          git -C feature push origin HEAD:refs/heads/feat/v2.0.0-single-model-pet
          git -C qa-repo config user.name 'github-actions[bot]'
          git -C qa-repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C qa-repo add -A -- qa/checkpoints/v2.0.0 .github/workflows/pet-checkpoint.yml
          git -C qa-repo commit -m 'checkpoint: retain passed and failed pet evidence and retire one-shot archive workflow'
          git -C qa-repo push origin HEAD:refs/heads/qa/single-model-pet-20261023
          test "$(git -C feature ls-remote origin refs/heads/main | cut -f1)" = '6a9649612dc99ed8030aa5e961af42a37902598f'
          echo "FEATURE_COMMIT=$(git -C feature rev-parse HEAD)"
          echo "QA_COMMIT=$(git -C qa-repo rev-parse HEAD)"
          echo 'Checkpoint saved. No tests, model requests, release or market publication were run.'
