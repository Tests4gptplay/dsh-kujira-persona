name: Publish verified Kujira 2.4.0
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release-v2.4.0.yml'
      - 'scripts/release-v2.4.0/**'
permissions:
  contents: read
concurrency:
  group: kujira-release-v2.4.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Tests4gptplay/dsh-kujira-persona'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match tested package tooling
        run: npm install -g npm@11.9.0 --ignore-scripts
      - name: Verify staged update lifecycle before publishing
        run: node --test upgrade-notice.test.js scripts/release-v2.4.0/locale-platform-check.mjs
      - name: Rebuild and verify exact tested 249-file package
        run: |
          mkdir dist
          npm pack --ignore-scripts --pack-destination dist
          python scripts/release-v2.4.0/verify-package.py dist
          cp scripts/release-v2.4.0/SHA256SUMS.txt dist/
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish formal 2.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/dsh-kujira-persona
        run: |
          set -euo pipefail
          TAG='v2.4.0'
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-query.err"; then
            echo 'Release already exists; refusing to overwrite any assets.'
            exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/release-query.err" || { cat "$RUNNER_TEMP/release-query.err"; exit 1; }
          gh release create "$TAG" \
            --target '${{ github.sha }}' \
            --title 'Kujira 2.4.0' \
            --notes-file scripts/release-v2.4.0/NOTES.md \
            --latest=true \
            dist/dsh-kujira-persona-2.4.0.tgz dist/SHA256SUMS.txt
