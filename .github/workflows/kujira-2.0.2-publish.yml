name: Kujira 2.0.2 tagged GitHub release
on:
  push:
    branches:
      - 'release/v2.0.2-ci'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '8ef2774f834a185a9b72e9a5b372b8a340e98a9d'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify source and selected-session regressions
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 3 \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          SDK="$RUNNER_TEMP/kujira-session-sdk"
          npm install --prefix "$SDK" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org \
            @deepseek-ai/dsh-session@0.2.1-rc.2 @deepseek-ai/dsh-session-query@0.2.1-rc.2 \
            @deepseek-ai/dsh-session-projection@0.2.1-rc.2 @deepseek-ai/dsh-session-stats@0.2.1-rc.2 \
            @deepseek-ai/cordis@4.0.5
          DSH_TEST_ROOT="$SDK" node --test $(find scripts/qa -name '*check.mjs' ! -name 'playable-check.mjs' | sort)
      - name: Verify main, version and exact release package
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$CURRENT_MAIN" = '8ef2774f834a185a9b72e9a5b372b8a340e98a9d'
          node -e 'const p=require("./package.json");if(p.version!=="2.0.2"||!p.dsh?.bundle?.patch)process.exit(1)'
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          test "$(sha256sum dist/dsh-kujira-persona-2.0.2.tgz | cut -d ' ' -f1)" = '4370f8a6eb16fa8dad15a19134c92a8ca54aabccf5b291d85a9aee85e9b7b9c1'
          tar -tzf dist/dsh-kujira-persona-2.0.2.tgz > dist/file-list.txt
          grep -q '^package/pet/native/win-x64/KujiraPet.exe$' dist/file-list.txt
      - name: Publish v2.0.2 tag, notes and tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.2 >/dev/null 2>&1; then
            echo 'Release already exists; keeping existing published version.'
            exit 0
          fi
          gh release create v2.0.2 dist/dsh-kujira-persona-2.0.2.tgz \
            --repo "${GITHUB_REPOSITORY}" \
            --target '8ef2774f834a185a9b72e9a5b372b8a340e98a9d' \
            --title 'Kujira 2.0.2' \
            --notes-file docs/releases/v2.0.2.md \
            --latest
